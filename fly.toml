# fly launch --no-deploy  →  fly secrets set …  →  fly deploy
app = "self-consistency-answer-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Migrations run once, before the new machines take traffic, and a failure here
# aborts the deploy rather than starting a server against the wrong schema.
[deploy]
  release_command = "bun run --filter @sce/db db:deploy"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # The evaluator pass can run for minutes; do not reap idle-looking SSE streams.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
