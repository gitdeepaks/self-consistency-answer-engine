# Isolated staging resources/secrets; production topology from fly.toml.
app = "self-consistency-answer-engine-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
[deploy]
  release_command = "bun run --filter @sce/db db:deploy"
  strategy = "rolling"
[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  RUN_TRANSPORT = "redis"
[processes]
  api = "bun run packages/server/src/index.ts"
  worker = "bun run packages/worker/src/index.ts"
[http_service]
  processes = ["api"]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"
[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "1gb"
